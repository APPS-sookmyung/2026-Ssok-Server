# 로컬 통합 실행 / 단일 서버 배포용 기본 구성
#   cp .env.example .env  # 값 채우기
#   docker compose up -d --build            # MySQL + pgvector + Spring
#   docker compose --profile ai up -d       # AI 서버 이미지까지 함께 (AI_SERVER_IMAGE 지정 필요)
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ssok_server
      MYSQL_USER: ${DB_USERNAME:-ssok}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # AI 서버가 사용하는 벡터 DB. 스키마는 AI 서버가 관리한다.
  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-ssok_vector}
      POSTGRES_USER: ${PGVECTOR_USER:-ssok}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./deploy/pgvector-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    # 배포 서버에서는 GHCR 이미지를 쓰고(deploy/deploy.sh), 로컬에서는 --build로 직접 빌드한다.
    image: ${SERVER_IMAGE:-ssok-server:local}
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/ssok_server?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-ssok}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8000}
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:?AI_CALLBACK_SECRET is required}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-http://server:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      # 외부 공개는 Nginx(HTTPS)가 맡으므로 로컬 루프백에만 연다.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  # AI 서버 (AI 파트 이미지). 환경 변수 이름은 AI 파트와 맞춘다.
  ai-server:
    profiles: ["ai"]
    image: ${AI_SERVER_IMAGE:-ssok-ai-server:latest}
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PGVECTOR_USER:-ssok}:${PGVECTOR_PASSWORD}@pgvector:5432/${PGVECTOR_DB:-ssok_vector}
      SPRING_CALLBACK_BASE_URL: ${SERVER_PUBLIC_URL:-http://server:8080}
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mysql-data:
  pgvector-data:
