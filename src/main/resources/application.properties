spring.application.name=server
spring.config.import=optional:classpath:application-secret.properties

spring.datasource.url=jdbc:mysql://localhost:3306/ssok_server?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ssok
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000

ai.server.base-url=${AI_SERVER_URL:http://localhost:8000}
ai.server.connect-timeout=3s
ai.server.read-timeout=30s
ai.server.callback-secret=${AI_CALLBACK_SECRET:}

# Invitation policy defaults are provisional until the team meeting.
invitation.ttl=${INVITATION_TTL:72h}
invitation.accept-url=${INVITATION_ACCEPT_URL:http://localhost:3000/invitations/accept}
invitation.mail-from=${INVITATION_MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

file.storage.local-root=${FILE_STORAGE_LOCAL_ROOT:./.data/files}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

notification.inactivity-threshold=${NOTIFICATION_INACTIVITY_THRESHOLD:30d}
