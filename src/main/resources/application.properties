spring.application.name=server
spring.config.import=optional:classpath:application-secret.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ssok_server?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:ssok}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 연관 컬렉션(태그 등)을 북마크마다 따로 조회하지 않고 IN 쿼리로 묶어 가져온다 (N+1 방지)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000

ai.server.base-url=${AI_SERVER_URL:http://localhost:8000}
# AI 서버가 콜백을 보낼 이 서버의 외부 주소
ai.server.callback-base-url=${SERVER_PUBLIC_URL:http://localhost:8080}
ai.server.connect-timeout=3s
ai.server.read-timeout=30s
ai.server.callback-secret=${AI_CALLBACK_SECRET:}
# 콜백이 이 시간 안에 오지 않으면 분석을 FAILED로 처리
ai.server.analysis-timeout=10m
# 벡터 삭제·이동 반영 재시도 주기
ai.server.vector-sync-retry-interval=PT1M

# 교차 출처 허용: 웹 프론트 주소, 브라우저 확장 프로그램(chrome-extension://{확장 ID}) (쉼표로 구분)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 상태 확인: /actuator/health 만 공개 (로드밸런서·배포 스크립트용)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
