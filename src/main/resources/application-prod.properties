# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod)
# 필수 환경 변수: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, AI_SERVER_URL, AI_CALLBACK_SECRET,
#                SERVER_PUBLIC_URL, CORS_ALLOWED_ORIGINS
# AI_CALLBACK_SECRET이 비어 있으면 서버가 시작되지 않는다 (AiCallbackSecretValidator).

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# 마이그레이션 도구 도입 전까지는 update. 도입 후 validate로 바꾼다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# HTTPS 종료를 앞단 프록시(Nginx, 로드밸런서)에서 하므로 X-Forwarded-* 헤더를 신뢰한다.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 운영에서는 기본값 없이 반드시 지정한다.
ai.server.base-url=${AI_SERVER_URL}
ai.server.callback-base-url=${SERVER_PUBLIC_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
