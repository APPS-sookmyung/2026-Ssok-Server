# 서버 호스트의 Nginx 설정 (/etc/nginx/sites-available/ssok.conf)
# api.ssok.example 을 실제 도메인으로 바꾸고, 인증서는 certbot --nginx -d api.ssok.example 로 발급한다.

server {
    listen 80;
    server_name api.ssok.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ssok.example;

    ssl_certificate /etc/letsencrypt/live/api.ssok.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ssok.example/privkey.pem;

    # 파일 업로드 기능 도입 시 함께 조정
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 대화 검색은 AI 응답을 기다리므로 여유 있게 둔다 (AI read-timeout 30s)
        proxy_read_timeout 60s;
    }

    # AI 서버 콜백은 Spring으로만 들어온다. 상태 확인은 외부에 노출하지 않는다.
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
