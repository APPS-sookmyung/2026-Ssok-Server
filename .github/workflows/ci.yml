name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ssok_server
          MYSQL_USER: ssok
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TZ: Asia/Seoul
      DB_URL: jdbc:mysql://127.0.0.1:3306/ssok_server?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ssok
      DB_PASSWORD: ci-password
      # 테스트 전용 값 (운영 시크릿 아님)
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LWZvci10ZXN0cy1ub3QtdXNlZC1hbnl3aGVyZS1lbHNlLTEyMzQ1Njc4OTA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon -Duser.timezone=Asia/Seoul

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

      - name: Build jar
        run: ./gradlew bootJar --no-daemon -x test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
